<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mall Interactive Map | Extraction Squad</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoGqhL/9j7MZB5Jk=" crossorigin="">
<style>*{box-sizing:border-box}body{margin:0;background:#080e0c;color:#e8f5ed;font-family:system-ui,Arial,sans-serif}header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #254934}a{color:#91f9ae}h1{font-size:1.2rem;margin:0}.muted{color:#9cb8a6;font-size:.85rem}main{max-width:1400px;margin:auto;padding:16px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button{border:1px solid #427958;border-radius:8px;padding:10px 15px;background:#122319;color:#e7f5e9;cursor:pointer;font-weight:700}button[aria-pressed=true]{background:#a1f3b0;color:#09200f;border-color:#a1f3b0}#map{height:min(76vh,850px);min-height:420px;border:1px solid #355540;border-radius:10px;background:#e9ebea}.leaflet-container{background:#e9ebea}.note{font-size:.85rem;color:#b2c9b8;margin-top:10px}</style></head><body>
<header><div><h1>GOT Creator Collective · Mall Map</h1><div class="muted">Four-floor interactive map · Spawn locations coming soon</div></div><a href="/">← Back to Extraction Squad</a></header>
<main><nav class="controls" aria-label="Select mall floor"><button data-floor="B" aria-pressed="false">basement</button><button data-floor="0" aria-pressed="false">floor 0</button><button data-floor="1" aria-pressed="true">floor 1</button><button data-floor="2" aria-pressed="false">floor 2</button></nav><div id="map" role="region" aria-label="Zoomable Mall floor plan"></div><p class="note">Use pinch or scroll to zoom; drag to pan. This first release contains the original floor plans. Verified item markers will be added next.</p></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const floors={'B':{src:'maps/Basement.png',w:1406,h:1536},'0':{src:'maps/Floor0.png',w:1536,h:844},'1':{src:'maps/Floor1.png',w:1536,h:1021},'2':{src:'maps/Floor2.png',w:1536,h:780}};
const map=L.map('map',{crs:L.CRS.Simple,minZoom:-4,maxZoom:3,zoomSnap:.25,attributionControl:false});let overlay;
function selectFloor(id){const f=floors[id];const bounds=[[0,0],[f.h,f.w]];if(overlay)map.removeLayer(overlay);overlay=L.imageOverlay(f.src,bounds).addTo(map);map.setMaxBounds(L.latLngBounds(bounds).pad(0.4));map.fitBounds(bounds,{padding:[15,15]});document.querySelectorAll('[data-floor]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.floor===id)));}
document.querySelectorAll('[data-floor]').forEach(b=>b.addEventListener('click',()=>selectFloor(b.dataset.floor)));selectFloor('B');
</script></body></html>
